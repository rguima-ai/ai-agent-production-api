[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-production-api"
version = "1.0.0"
description = "FastAPI + Redis + LangGraph HITL + Phoenix para la Pre-entrega 7"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "arize-phoenix-otel>=0.17,<1.0",
    "fastapi>=0.140,<1.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-redis>=0.5,<1.0",
    "openinference-instrumentation-langchain>=0.1.79,<0.2",
    "openinference-instrumentation-openai>=0.1.65,<0.2",
    "opentelemetry-api>=1.39,<2.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.12,<3.0",
    "redis>=7.0,<9.0",
    "uvicorn[standard]>=0.38,<1.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.32,<3.0",
    "httpx>=0.28,<1.0",
    "mypy>=1.18,<2.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.3,<2.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.14,<1.0",
]

[project.scripts]
agent-api = "app.main:run"
agent-worker = "app.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "phoenix.*"]
ignore_missing_imports = true
